# LOCAL TESTING ONLY. Railway does not use this file.
# Secrets come from .env (gitignored). Copy .env.example to .env and fill it in.
#
#   docker compose up -d --build     start
#   docker compose down -v           stop and delete the test database

services:
  litellm:
    build: .
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      PORT: "4000"
      NUM_WORKERS: "1"
      LITELLM_LOG: ERROR
    ports:
      # Only reachable from this computer, not from other devices on the network.
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: litellm
    # No "ports:" on purpose: the database is only reachable by the litellm container.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
